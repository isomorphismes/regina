name: Agda translation

on:
  push:
    branches: [Agda]
    paths:
      - 'agda/**'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - 'agda/**'
      - '.github/workflows/agda.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install --yes agda-bin
          agda --version
      - name: Check translation and reduction tests
        run: >-
          agda --safe --without-K --ignore-interfaces
          --no-libraries --no-default-libraries
          -i agda agda/Regina/All.agda
