name: Agda translation

on:
  push:
    branches: [Agda]
    paths:
      - 'agda/**'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - 'agda/**'
      - '.github/workflows/agda.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout the pushed commit
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install --yes agda-bin
          agda --version
      - name: Check translation and reduction tests
        run: >-
          agda --safe --without-K --ignore-interfaces
          --no-libraries --no-default-libraries
          -i agda agda/Regina/All.agda
